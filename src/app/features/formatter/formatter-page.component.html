<div class="fmt-page fade-in">
  <app-format-controls
    [mode]="mode()"
    [indent]="indent()"
    (modeChange)="mode.set($event)"
    (indentChange)="indent.set($event)"
    (format)="onFormat()"
    (clear)="onClear()"
  />

  <div class="fmt-editors">
    <app-code-editor
      label="INPUT"
      [value]="inputJson()"
      [hasError]="errorMsg() !== null"
      [charCount]="inputJson().length"
      (valueChange)="
        inputJson.set($event); errorMsg.set(null); isValidated.set(false)
      "
    />

    <div class="fmt-output-wrapper">
      @if (showValidation()) {
        <app-validation-status [error]="errorMsg()" [isValid]="isValidated()" />
      } @else {
        <app-code-editor
          label="OUTPUT"
          [value]="outputJson()"
          [readOnly]="true"
          [charCount]="outputJson().length"
        />
      }
    </div>
  </div>

  <div class="fmt-privacy">
    <svg
      class="fmt-privacy-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
      <path d="M7 11V7a5 5 0 0 1 10 0v4" />
    </svg>
    <span
      >All processing happens in your browser. No data is sent to any
      server.</span
    >
  </div>
</div>
