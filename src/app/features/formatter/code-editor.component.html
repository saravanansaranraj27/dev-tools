<div class="fmt-panel" [class.panel-error]="hasError()">
  <div class="fmt-panel-header">
    <span class="fmt-panel-label">
      @if (readOnly()) {
        <svg
          class="fmt-panel-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="16 18 22 12 16 6" />
          <polyline points="8 6 2 12 8 18" />
        </svg>
      } @else {
        <svg
          class="fmt-panel-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
          />
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
        </svg>
      }
      {{ label() }}
    </span>
    <span class="fmt-panel-meta">
      @if (charCount() !== undefined) {
        <span>{{ charCount() }} chars</span>
      }
      @if (readOnly() && value() && !hasError()) {
        <button
          class="fmt-copy-btn"
          [class.copied]="isCopied()"
          (click)="copyOutput()"
        >
          @if (isCopied()) {
            <svg
              class="fmt-copy-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="20 6 9 17 4 12" />
            </svg>
            <span>Copied</span>
          } @else {
            <svg
              class="fmt-copy-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
              <path
                d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
              />
            </svg>
            <span>Copy</span>
          }
        </button>
      }
    </span>
  </div>
  <textarea
    class="fmt-textarea"
    [class.has-error]="hasError()"
    [class.output]="readOnly()"
    [value]="value()"
    [readOnly]="readOnly()"
    [placeholder]="
      readOnly() ? 'Output will appear here...' : 'Paste your JSON here...'
    "
    spellcheck="false"
    (input)="onInput($event)"
  ></textarea>
</div>
